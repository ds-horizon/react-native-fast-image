name: Merge Release PR and Publish

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Common Setup
        uses: ./.github/actions/setup

      - name: Configure NPM authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm config set @d11:registry https://registry.npmjs.org/

      - name: Check NPM config
        run: npm config list

      - name: Extract version from release branch name
        id: extract_version
        run: |
          TAG_NAME=${{ github.event.pull_request.head.ref }}
          VERSION=${TAG_NAME#release-}  # Remove 'release-' prefix
          echo "VERSION=$VERSION" >> $GITHUB_ENV  # Save version as environment variable
        shell: bash

      - name: Extract changelog for version
        id: extract_changelog
        run: |
          VERSION_NUMBER=${VERSION#v}  # Remove 'v' prefix for matching
          # Extract changelog section between this version and next version header
          CHANGELOG=$(awk "/^## \[${VERSION_NUMBER}\]/{flag=1; next} /^## \[|^### Changelog/{if(flag) exit} flag" CHANGELOG.md)
          # Handle multiline content for GitHub Actions
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        shell: bash

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
